# Необов'язкові перевизначення. Якщо рядок закоментований, демон шукає
# словник сам: спершу /usr/share/hunspell, потім запасний файл поруч із програмою.
# dict-en=/usr/share/hunspell/en_US.dic
# dict-uk=/usr/share/hunspell/uk_UA.dic
# dict-ru=/usr/share/hunspell/ru_RU.dic

min-length=3
# Термінали, менеджери паролів і окремі вікна пароля. Діалог polkit Cinnamon сидить у самій оболонці.
exclude=gnome-terminal,terminator,xterm,alacritty,kitty,konsole,tilix,xfce4-terminal,wezterm,urxvt,mate-terminal,cinnamon-screensaver,org.cinnamon.ScreenSaver,gcr-prompter,keepassxc,bitwarden,1password,emacs,gvim,layout-fix
# Слова-винятки через кому, які ніколи не автовиправляються (без урахування регістру).
# ignore-words=kubectl,systemd
pause-key=Pause
undo-key=Shift+Pause
convert-key=Alt+Pause
